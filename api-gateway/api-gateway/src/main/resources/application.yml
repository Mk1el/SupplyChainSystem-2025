server:
  port: 8900

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # --- SECURITY SERVICE ---
            - id: security-service
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/api/security/**, /v3/api-docs/security-service
              filters:
                - StripPrefix=1

            # --- INVENTORY SERVICE ---
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**, /v3/api-docs/inventory-service
              filters:
                - StripPrefix=1

            # --- ORDER SERVICE ---
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**, /v3/api-docs/order-service
              filters:
                - StripPrefix=1

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: SECURITY-SERVICE
        url: /api/security/v3/api-docs
      - name: INVENTORY-SERVICE
        url: /api/inventory/v3/api-docs
      - name: ORDER-SERVICE
        url: /api/orders/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: veryLongSecretKeyReplaceWithEnvOrKmsAtRuntime12345

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springdoc: DEBUG
    reactor.netty.http.client: DEBUG
